<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10120f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>ТРИМАЙ СИСТЕМУ</title></head><body><main class="panel"><header><div><small>БЛОК R-01</small><h1>ТРИМАЙ СИСТЕМУ</h1></div><div id="status" class="status ok">СТАБІЛЬНО</div></header><section class="timer"><span>ЧАС РОБОТИ</span><strong id="timer">00:00.0</strong><span id="best">РЕКОРД 00:00.0</span></section><section id="alarms" class="alarms"><div class="alarm">НЕМАЄ АКТИВНИХ ТРИВОГ</div></section><section class="meters" id="meters"></section><section class="controls"><button data-act="pump"><b>НАСОС ОХОЛОДЖЕННЯ</b><span>ВИМК</span></button><button data-act="generator"><b>ДОП. ГЕНЕРАТОР</b><span>ВИМК</span></button><button data-act="valve"><b>ГОЛОВНИЙ КЛАПАН</b><span>50%</span></button><button data-act="vent"><b>СКИДАННЯ ТИСКУ</b><span>ЗАКРИТО</span></button><button data-act="cool"><b>АВАР. ОХОЛОДЖЕННЯ</b><span>ГОТОВО</span></button><button data-act="scram" class="danger"><b>SCRAM</b><span>ГОТОВИЙ</span></button></section><section class="log"><div>ЖУРНАЛ ПОДІЙ</div><p id="log">R-01 у мережі. Утримуй систему стабільною.</p></section><button id="restart" class="restart hidden">ПЕРЕЗАПУСТИТИ БЛОК</button><footer>R-01 // ТЕРМІНАЛ КЕРУВАННЯ v0.01</footer></main><script src="game.js"></script></body></html>
